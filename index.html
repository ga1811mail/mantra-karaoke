<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📿 經文跟唸版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:linear-gradient(160deg,#150a28 0%,#2a1450 60%,#1a0f33 100%); color:#e8e0f5; font-family:"PingFang TC","Microsoft JhengHei",sans-serif; min-height:100vh; padding:40px 20px; }
  h1 { text-align:center; font-size:26px; letter-spacing:6px; color:#ffd54a; text-shadow:0 0 18px rgba(255,213,74,.35); margin-bottom:6px; }
  .sub { text-align:center; font-size:13px; color:#9b8cc0; letter-spacing:2px; margin-bottom:30px; }
  .grid { max-width:720px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .card { display:block; background:rgba(255,255,255,.04); border:1px solid rgba(255,213,74,.25); border-radius:16px; padding:22px; text-decoration:none; color:#e8e0f5; transition:all .2s; }
  .card:hover { border-color:#ffd54a; background:rgba(255,213,74,.08); transform:translateY(-2px); box-shadow:0 8px 24px rgba(255,213,74,.15); }
  .card .name { font-size:18px; font-weight:700; color:#ffd54a; margin-bottom:6px; letter-spacing:1px; }
  .card .desc { font-size:13px; color:#b9a8e8; line-height:1.6; }
  .card .tag { display:inline-block; margin-top:10px; font-size:11px; color:#9b8cc0; background:rgba(106,79,176,.3); border-radius:20px; padding:3px 10px; }
  .linkbox { max-width:720px; margin:34px auto 0; background:rgba(255,255,255,.04); border:1px dashed rgba(255,213,74,.35); border-radius:14px; padding:14px 16px; }
  .linkbox label { font-size:13px; color:#c9b8f0; display:block; margin-bottom:8px; }
  .linkbox .row { display:flex; gap:10px; flex-wrap:wrap; }
  .linkbox input { flex:1; min-width:200px; background:#241545; color:#e8e0f5; border:1px solid #6a4fb0; border-radius:8px; padding:9px 12px; font-size:14px; outline:none; }
  .linkbox input:focus { border-color:#ffd54a; }
  .linkbox button { background:linear-gradient(135deg,#ffd54a,#ff9d2e); color:#3a2500; border:none; border-radius:20px; padding:9px 20px; font-size:14px; font-weight:700; cursor:pointer; }
  .linkbox .msg { font-size:12px; color:#7d6ea8; margin-top:8px; }
  .linkbox .msg.ok { color:#7ee787; }
  .ppanel { margin-top:12px; border-top:1px solid rgba(255,213,74,.2); padding-top:12px; }
  .ppanel .phead { font-size:13px; color:#ffd54a; margin-bottom:8px; letter-spacing:1px; }
  .ppanel .prow { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
  .ppanel .prow span { font-size:12px; color:#c9b8f0; width:110px; flex-shrink:0; }
  .ppanel .pbar { flex:1; height:9px; background:#3a2a66; border-radius:5px; overflow:hidden; }
  .ppanel .pbar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#6a4fb0,#b39ddb); border-radius:5px; transition:width .6s; }
  .ppanel .prow.done span { color:#7ee787; }
  .ppanel .prow.done .pbar i { width:100%; background:linear-gradient(90deg,#2ea043,#7ee787); }
  .ppanel .prow.active .pbar i { width:55%; background:linear-gradient(90deg,#ffd54a,#ff9d2e); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }
  .ppanel .pnote { font-size:12px; color:#9b8cc0; margin-top:6px; }
  .ppanel .pnote a { color:#7ee787; }
  .foot { text-align:center; margin-top:40px; font-size:12px; color:#6a5a95; letter-spacing:1px; }
  @media (max-width:640px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1>📿 經文跟唸版</h1>
<div class="sub">卡拉OK 式逐字拼音跟唸 ｜ 速度可調 ｜ 單句重複 ｜ 遍數計次</div>

<div class="grid">
  <a class="card" href="shurangama/">
    <div class="name">楞嚴咒心</div>
    <div class="desc">Shurangama Mantra · 破魔第一咒心。果濱居士逐句練習版，快誦一遍 10 秒，慢速跟唸最舒服。</div>
    <span class="tag">🔂 單句重複</span> <span class="tag">🔁 整段</span> <span class="tag">⏱ 0.4–1.5×</span>
  </a>
  <a class="card" href="vajrasattva/">
    <div class="name">金剛薩埵百字明</div>
    <div class="desc">懺罪之王 · 淨化業障。逐字拼音 highlight，聽一句跟一句，適合初學者。</div>
    <span class="tag">🔂 單句重複</span> <span class="tag">🔁 整段</span> <span class="tag">⏱ 0.4–1.5×</span>
  </a>
</div>

<div class="linkbox">
  <label>🔗 有其他經文影片連結想轉做跟唸版？</label>
  <div class="row">
    <input id="linkInput" type="url" placeholder="https://weixin.qq.com/sph/... 或 YouTube 連結" spellcheck="false">
    <button id="linkGo">複製連結去 Hermes</button>
  </div>
  <div class="msg" id="linkMsg">㩒掣自動複製 → 貼去 Hermes 對話（話「整呢條嘅跟唸版」），Hermes 會自動下載→轉錄→配拼音→上架呢度。</div>
</div>

<div class="foot">製作：Hermes ｜ 音頻為影片真實唸誦 ｜ 願一切眾生離苦得樂 🙏</div>

<script>
async function copyText(url) {
  // 方法1: Clipboard API（現代瀏覽器，HTTPS 可用）
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(url);
      return true;
    }
  } catch(e) {}
  // 方法2: execCommand（fallback，iOS Safari 技巧）
  try {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, url.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e) { return false; }
}
document.getElementById('linkGo').onclick = async () => {
  const url = document.getElementById('linkInput').value.trim();
  const msg = document.getElementById('linkMsg');
  const btn = document.getElementById('linkGo');
  if (!/^https?:\/\//i.test(url)) {
    msg.className = 'msg'; msg.textContent = '⚠ 請輸入完整連結（http/https 開頭）';
    return;
  }
  btn.textContent = '⏳ 複製中…';
  const ok = await copyText(url);
  btn.textContent = ok ? '✅ 已複製！' : '⚠ 自動複製失敗';
  msg.className = 'msg' + (ok ? ' ok' : '');
  msg.textContent = ok
    ? '✅ 已複製！去 Hermes 對話貼上，話「整呢條嘅跟唸版」就得。'
    : '自動複製唔得 — 下面條連結已幫你選取，長按／⌘C 手動複製：';
  if (!ok) {
    const u = document.createElement('div');
    u.style.cssText = 'margin-top:6px;padding:6px 10px;background:#241545;border-radius:8px;word-break:break-all;color:#ffd54a;font-size:12px;';
    u.textContent = url;
    msg.appendChild(u);
  }
  document.getElementById('linkInput').select();
  showProgress(url);
};

// ── 處理進度 bar：提交後輪詢 status.json（Hermes 每階段 git push 更新）──
const STAGES = ['等待處理','下載影片','轉錄經文','整理拼音解釋','生成跟唸版','上架公開站','完成'];
let pollTimer = null;
function showProgress(url) {
  let panel = document.getElementById('ppanel');
  if (!panel) {
    panel = document.createElement('div');
    panel.className = 'ppanel'; panel.id = 'ppanel';
    panel.innerHTML =
      '<div class="phead">⏳ Hermes 處理中 — 自動更新進度</div>' +
      [1,2,3,4,5].map(s => `<div class="prow" data-st="${s}"><span>${s}. ${STAGES[s]}</span><div class="pbar"><i></i></div></div>`).join('') +
      '<div class="pnote" id="pnote">等待 Hermes 開始處理…</div>';
    document.querySelector('.linkbox').appendChild(panel);
  }
  panel.style.display = 'block';
  clearInterval(pollTimer);
  pollTimer = setInterval(() => pollStatus(url), 10000);
  pollStatus(url);
}
function renderStages(job) {
  const rows = document.querySelectorAll('.ppanel .prow');
  rows.forEach(r => r.classList.remove('done','active'));
  const st = job.stage || 0;
  rows.forEach(r => {
    const n = parseInt(r.dataset.st);
    if (st > n) r.classList.add('done');
    else if (st === n && st < 6) r.classList.add('active');
    else if (st >= 6) r.classList.add('done');
  });
  const note = document.getElementById('pnote');
  if (st >= 6) {
    const u = job.url || '';
    note.innerHTML = u
      ? `✅ <b>已上架！</b> <a href="${u}" target="_blank">開啟跟唸版 →</a>`
      : '✅ 已上架！';
    clearInterval(pollTimer);
  } else {
    note.textContent = '⏳ ' + (job.stageName || STAGES[st] || '處理中') + '…（每 10 秒自動更新）';
  }
}
async function pollStatus(url) {
  try {
    const r = await fetch('status.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const d = await r.json();
    const job = d.jobs && d.jobs[url];
    renderStages(job ? job : {stage: 0, stageName: '等待 Hermes 開始處理', url: ''});
  } catch(e) {}
}
</script>
</body>
</html>
