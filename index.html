<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📿 選經 · 讀經 App</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:linear-gradient(160deg,#150a28 0%,#2a1450 60%,#1a0f33 100%); color:#e8e0f5; font-family:"PingFang TC","Microsoft JhengHei",sans-serif; min-height:100vh; padding:0 14px 46px; }
  .topnav { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px; background:rgba(21,10,40,.92); backdrop-filter:blur(6px); padding:12px 4px; border-bottom:1px solid rgba(255,213,74,.18); }
  .navbtn { display:inline-flex; align-items:center; justify-content:center; min-height:56px; padding:0 20px; border-radius:16px; border:2px solid rgba(255,213,74,.45); background:rgba(255,213,74,.08); color:#ffd54a; font-size:20px; font-weight:700; text-decoration:none; cursor:pointer; flex-shrink:0; }
  .navbtn:active { transform:scale(.96); background:rgba(255,213,74,.2); }
  .navbtn.exit { border-color:rgba(255,120,120,.5); background:rgba(255,80,80,.12); color:#ffb0b0; }
  .t-title { flex:1; text-align:center; font-size:23px; font-weight:700; color:#ffd54a; letter-spacing:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ver { font-size:13px; color:#9b8cc0; background:rgba(21,10,40,.8); border:1px solid rgba(107,79,176,.45); padding:3px 10px; border-radius:12px; flex-shrink:0; }
  h1 { text-align:center; font-size:34px; letter-spacing:6px; color:#ffd54a; text-shadow:0 0 20px rgba(255,213,74,.4); margin:30px 0 4px; }
  .sub { text-align:center; font-size:16px; color:#b9a8e8; letter-spacing:2px; margin-bottom:28px; }
  /* 大字經文卡：成張卡都係撳區 */
  .grid { max-width:760px; margin:0 auto; display:grid; grid-template-columns:1fr; gap:18px; }
  .cwrap { position:relative; }
  .card { display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.05); border:2px solid rgba(255,213,74,.3); border-radius:22px; padding:22px 24px; text-decoration:none; color:#e8e0f5; min-height:96px; }
  .card:active { background:rgba(255,213,74,.14); transform:scale(.985); }
  .card .nm { font-size:30px; font-weight:800; color:#ffd54a; letter-spacing:1px; line-height:1.3; }
  .card .ds { font-size:15px; color:#b9a8e8; line-height:1.5; margin-top:4px; }
  .card .go2 { margin-left:auto; font-size:36px; color:#ffd54a; flex-shrink:0; }
  .plhead { max-width:760px; margin:34px auto 14px; font-size:22px; font-weight:700; color:#ffd54a; letter-spacing:2px; }
  .plhead .cnt { font-size:14px; font-weight:400; color:#8b7fb0; margin-left:10px; }
  .admbtn { display:block; max-width:760px; margin:26px auto 0; min-height:64px; width:100%; border-radius:18px; border:2px dashed rgba(155,140,192,.5); background:rgba(155,140,192,.07); color:#c9b8f0; font-size:20px; font-weight:600; cursor:pointer; }
  .admbtn:active { transform:scale(.98); background:rgba(155,140,192,.16); }
  .foot { text-align:center; margin-top:30px; font-size:13px; color:#6a5a95; letter-spacing:1px; line-height:1.8; }
  @media (max-width:480px) { .card .nm { font-size:25px; } .t-title { font-size:19px; } h1 { font-size:28px; } }
</style>
</head>
<body>
<div class="topnav">
  <div class="t-title">📿 讀經</div>
  <a class="navbtn exit" href="exit.html" title="完全退出">✕ 退出</a>
  <span class="ver">v4.12.0</span>
</div>
<h1>📿 選經</h1>
<div class="sub">揀經文 → 揀速度設置 → 跟住讀經</div>

<div class="grid" id="grid"></div>

<div class="plhead" id="plhead" style="display:none;">📜 播放清單<span class="cnt" id="plcnt"></span></div>
<div class="grid" id="plgrid"></div>

<button class="admbtn" id="adminBtn">⚙ 設置／加新經</button>

<div class="foot">音頻為影片真實唸誦 ｜ 願一切眾生離苦得樂 🙏</div>

<script>
// 按鈕聲效＋振動
let actx = null;
function tapFx() {
  try {
    if (navigator.vibrate) navigator.vibrate(12);
    if (!window.AudioContext && !window.webkitAudioContext) return;
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = 620;
    g.gain.setValueAtTime(0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.07);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.08);
  } catch(e) {}
}
document.addEventListener('click', e => { if (e.target.closest('a, button')) tapFx(); });

// 設置存在？直入卡定經設置頁
function openCard(slug) {
  // 每次揀經必經設置 tab（default 帶返上次設定），撳「開始讀經」先入讀經
  location.href = 'settings.html?card=' + slug + '&t=' + encodeURIComponent(document.querySelector('a[data-slug="' + slug + '"]')?.dataset.title || '');
}
// 手作卡
function addManual(grid, slug, name, desc) {
  const w = document.createElement('div'); w.className = 'cwrap';
  const a = document.createElement('a'); a.className = 'card'; a.href = 'javascript:void(0)';
  a.dataset.slug = slug; a.dataset.title = name;
  a.innerHTML = '<div><div class="nm">' + name + '</div><div class="ds">' + desc + '</div></div><span class="go2">▶</span>';
  a.addEventListener('click', () => openCard(slug));
  w.appendChild(a); grid.appendChild(w);
}
addManual(document.getElementById('grid'), 'shurangama', '楞嚴咒心', '破魔第一咒心 · 果濱居士逐句練習版，快誦一遍 10 秒');
addManual(document.getElementById('grid'), 'vajrasattva', '金剛薩埵百字明', '懺罪之王 · 淨化業障。逐字拼音 highlight，聽一句跟一句');

// 播放清單（playlist.json 權威）
async function loadAutoCards() {
  const grid = document.querySelector('#plgrid');
  const addCard = job => {
    if (!job || !job.url) return;
    const slug = job.url.split('/').filter(Boolean).slice(-1)[0] || '';
    if (!slug || document.querySelector(`#plgrid a[data-slug="${slug}"]`)) return;
    const w = document.createElement('div'); w.className = 'cwrap';
    const a = document.createElement('a'); a.className = 'card'; a.href = 'javascript:void(0)';
    a.dataset.slug = slug;
    const name = String(job.title || '經文').split(/[-|｜]/)[0].trim().slice(0, 22);
    a.dataset.title = name;
    a.innerHTML = '<div><div class="nm">' + name + '</div><div class="ds">自動跟唸版（中文音譯＋逐句註解）' + (job.date ? ' · ' + job.date : '') + '</div></div><span class="go2">▶</span>';
    a.addEventListener('click', () => openCard(slug));
    w.appendChild(a); grid.appendChild(w);
  };
  const showHead = () => {
    const head = document.getElementById('plhead');
    const n = grid.querySelectorAll('.cwrap').length;
    head.style.display = n ? 'block' : 'none';
    const cnt = document.getElementById('plcnt');
    if (cnt) cnt.textContent = n ? n + ' 首' : '';
  };
  try {
    const r = await fetch('playlist.json?t=' + Date.now(), {cache:'no-store'});
    if (r.ok) {
      const pl = await r.json();
      Object.values(pl || {}).forEach(e => addCard(e));
      showHead();
      return;
    }
  } catch(e) {}
  try {
    const r = await fetch('status.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const d = await r.json();
    Object.values(d.jobs || {}).forEach(job => {
      if (!job.url || (job.stage || 0) < 6) return;
      addCard(job);
    });
    showHead();
  } catch(e) {}
}
loadAutoCards();
document.getElementById('adminBtn').addEventListener('click', () => { location.href = 'settings.html'; });
</script>
</body>
</html>
