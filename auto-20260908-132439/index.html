// 聲效（WebAudio click）：每撳掣短「噠」聲；振動：Android 支援
let _actx = null;
function tapFx() {
  try {
    if (navigator.vibrate) navigator.vibrate(12);
    if (!window.AudioContext && !window.webkitAudioContext) return;
    _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === 'suspended') _actx.resume();
    const o = _actx.createOscillator(), g = _actx.createGain();
    o.type = 'sine'; o.frequency.value = 760;
    g.gain.setValueAtTime(0.25, _actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, _actx.currentTime + 0.09);
    o.connect(g); g.connect(_actx.destination);
    o.start(); o.stop(_actx.currentTime + 0.08);
  } catch(e) {}
}

// 速度 → 離線音頻檔（atempo 保音高，音色唔變）。scale = 原軸時間 × rate = currentTime
const RATES = {
  '0.4':  {f:'audio_040.m4a', s:0.4},
  '0.5':  {f:'audio_050.m4a', s:0.5},
  '0.6':  {f:'audio_060.m4a', s:0.6},
  '0.75': {f:'audio_075.m4a', s:0.75},
  '1':    {f:'audio_full.wav', s:1},
  '1.25': {f:'audio_125.m4a', s:1.25},
  '1.5':  {f:'audio_150.m4a', s:1.5}
};
let curRate = MK.get('speed', '1');   // P2 記低嘅速度
if (!RATES[curRate]) curRate = '1';
let chars = [], lines = [];
document.querySelectorAll('.line').forEach(sec => {
  const chs = [];
  sec.querySelectorAll('.ch').forEach(el => chs.push({el, s:parseFloat(el.dataset.s), e:parseFloat(el.dataset.e)}));
  lines.push({sec, s:parseFloat(sec.dataset.s), e:parseFloat(sec.dataset.e), chs});
});
// ══ 固定窗口 fit：句子超出 stage（固定高度）就縮字，floor = 0.62×base；排位唔變 ══
let FS_BASE = null;
function fitStage() {
  const st = document.querySelector('.stage');
  if (!st || !st.clientHeight) return;
  if (FS_BASE === null) FS_BASE = parseFloat(getComputedStyle(document.body).getPropertyValue('--fs')) || 64;
  st.style.removeProperty('--fs');            // 每次由完整字級重新 fit
  const cs = getComputedStyle(st);
  const pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
  const floor = Math.max(30, FS_BASE * 0.45);
  for (let it = 0; it < 14; it++) {
    const av = st.clientHeight - pt - pb - 4;   // 留 4px 保險，任何情況唔掂邊
    const need = st.scrollHeight - pt - pb;
    if (need <= av) break;                 // 放得落，用返完整字級
    let cur = parseFloat(getComputedStyle(st).getPropertyValue('--fs'));
    if (!(cur > 0)) cur = FS_BASE;
    const nfs = Math.max(floor, Math.floor(cur * (av / need) * 100) / 100);
    if (nfs >= cur) break;
    st.style.setProperty('--fs', nfs + 'px');  // 只縮 stage 範圍，其他版面唔郁
  }
}
window.addEventListener('resize', () => { if (curIdx >= 0) fitStage(); });

function renderCur(i) {
  const src = lines[i].sec, cur = document.getElementById('curLine');
  cur.innerHTML = '';
  const syl = document.createElement('div'); syl.className = 'syl';
  src.querySelectorAll('.grp').forEach(g => {
    const ng = document.createElement('span'); ng.className = 'grp';
    g.querySelectorAll('.ch').forEach(c => {
      const nc = document.createElement('span'); nc.className = 'ch';
      nc.dataset.s = c.dataset.s; nc.dataset.e = c.dataset.e;
      const b = document.createElement('b'); b.textContent = c.querySelector('b').textContent;
      const ii = document.createElement('i'); ii.textContent = c.querySelector('i').textContent;
      nc.appendChild(b); nc.appendChild(ii);
      ng.appendChild(nc);
    });
    syl.appendChild(ng);
  });
  cur.appendChild(syl);
  // 中文註解：explanations.json perLine 優先（冇就用 data 內嵌 explain）
  const note = document.getElementById('noteLine');
  if (note) {
    let txt = src.querySelector('.note') ? src.querySelector('.note').textContent : '';
    if (window.__EX && window.__EX.perLine && window.__EX.perLine[i]) txt = window.__EX.perLine[i];
    note.textContent = txt;
  }
  // 下一句預告（只有漢字，唔 highlight；冇下句＝迴向）
  const nx = document.getElementById('nextLine');
  if (nx) {
    if (i + 1 < lines.length) {
      const hs = [];
      lines[i + 1].sec.querySelectorAll('.ch b').forEach(bb => hs.push(bb.textContent));
      nx.innerHTML = '<span class="nxlabel">下一句</span>' + hs.join('');
    } else {
      nx.innerHTML = '<span class="nxlabel">下一句</span>🙏 唸完迴向一切眾生';
    }
  }
  chars = [];
  cur.querySelectorAll('.ch').forEach(el => chars.push({el, s:parseFloat(el.dataset.s), e:parseFloat(el.dataset.e)}));
  fitStage();
}
let curIdx = -1;
let abA = -1, abB = -1;   // 原時間軸
let singleLine = -1;      // 🔂 單句重複：-1 = 關
let seeking = false;      // seek 進行中，防重入
let goal = parseInt(MK.get('goal', '0')) || 0, remain = goal, counting = false, passCounted = false;
let goalTag = document.getElementById('goalTag');
function updGoalTag() { if (goalTag) goalTag.textContent = '目標 ' + (goal === 0 ? '∞' : goal); }

function applyLit(t) {
  let lit = -1;
  for (let i=0;i<chars.length;i++) { if (t >= chars[i].s && t < chars[i].e) { lit = i; break; } }
  chars.forEach((c,i) => c.el.classList.toggle('lit', i===lit));
}
function onSeeked() { seeking = false; }
function seekTo(tRaw) {
  seeking = true;
  AUDIO.currentTime = tRaw;
  AUDIO.removeEventListener('seeked', onSeeked);
  AUDIO.addEventListener('seeked', onSeeked, {once:true});
  setTimeout(() => { seeking = false; }, 1000);   // 保險：冇 seeked 都放行
}

function updCounter() {
  const el = document.getElementById('remain');
  el.textContent = goal === 0 ? '∞' : remain;
  updGoalTag();
}
function tick() {
  const t = AUDIO.currentTime * RATES[curRate].s;   // 原時間軸
  const tDisp = t;
  const _bar = document.getElementById('bar'); if (_bar) _bar.style.width = (Math.min(t, DUR) / DUR * 100) + '%';
  const _tm = document.getElementById('timer'); if (_tm) _tm.textContent = t.toFixed(1) + ' / ' + DUR.toFixed(1) + ' s';
  let li = lines.findIndex(L => tDisp >= L.s && tDisp < L.e);
  if (li === -1 && tDisp >= lines[lines.length-1].e && tDisp < LAST_END + 0.2) li = lines.length - 1;
  if (li !== curIdx) {
    lines.forEach((L,i) => L.sec.classList.toggle('playing', i===li));
    if (li !== -1) { renderCur(li); curIdx = li; }
  }
  applyLit(tDisp);
  // 計次：按播放開始倒數，完整唸完一遍（過 lastEnd）→ -1
  if (counting && goal > 0 && t >= LAST_END && !passCounted) {
    passCounted = true;
    remain--;
    updCounter();
    const el = document.getElementById('remain');
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    if (remain <= 0) {
      document.getElementById('done').textContent = '🎉 完成 ' + goal + ' 遍！功德迴向一切眾生 🙏';
      document.getElementById('done').style.display = 'block';
      AUDIO.pause();
      AUDIO.loop = false;
      document.getElementById('playBtn').textContent = '▶ 播放';
      counting = false;
    }
  }
  if (t < 1.0) passCounted = false;
}
AUDIO.addEventListener('timeupdate', tick);
// rAF 驅動（60fps）：timeupdate 得 ~4Hz 太疏，highlight 慢半拍就係「唔準」嘅元兇
(function loop() { tick(); requestAnimationFrame(loop); })();
AUDIO.addEventListener('ended', () => {
  document.getElementById('playBtn').textContent = '▶ 播放';

  if (counting && goal > 0 && !passCounted) {
    passCounted = true; remain--; updCounter();
    const el = document.getElementById('remain');
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    if (remain <= 0) {
      document.getElementById('done').textContent = '🎉 完成 ' + goal + ' 遍！功德迴向一切眾生 🙏';
      document.getElementById('done').style.display = 'block';
      counting = false;
    }
  }
});
document.getElementById('playBtn').onclick = () => {
  if (AUDIO.paused) {
    if (goal > 0 && !counting) { counting = true; passCounted = false; }
    AUDIO.loop = (goal > 0);
    document.getElementById('remain').classList.add('counting');
    AUDIO.play();
    document.getElementById('playBtn').textContent = '⏸ 暫停';
  } else {
    AUDIO.pause();
    document.getElementById('playBtn').textContent = '▶ 播放';
  }
};
// ── 經文解釋：直接顯示喺唸讀框（explanations.json perLine 逐句義理）──
(async () => {
  try {
    const r = await fetch('../explanations.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const lib = await r.json();
    const slug = location.pathname.split('/').filter(Boolean).pop() || '';
    let ex = lib[slug];
    if (!ex) {
      const t = document.title;
      ex = Object.values(lib).find(e => (e.match || []).some(k => t.includes(k)));
    }
    window.__EX = ex || null;
    if (window.__EX && window.__EX.perLine && curIdx >= 0) renderCur(curIdx);
  } catch(e) {}
})();
// 讀取設置：速度／對齊／目標 select 同步（長者版 P2 寫入 localStorage）
(function initMK() {
  if (curRate !== '1' && RATES[curRate]) { AUDIO.src = RATES[curRate].f; AUDIO.load(); }
  // ← 返回：去設置頁（帶 card slug + title），唔係首頁
  const bb = document.getElementById('backBtn');
  if (bb) {
    const segs = location.pathname.split('/').filter(Boolean);
    const slug = segs[segs.length - 2] || '';
    bb.href = '../settings.html?card=' + encodeURIComponent(slug) + '&t=' + encodeURIComponent(document.title.split('·')[0].trim());
  }
})();
window.__EX = window.__EX || null;
renderCur(0);
updAB(); updCounter();
</script>
